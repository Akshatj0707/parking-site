# Render Blueprint for the FREE size of this website. It puts the site on the internet at no cost.
# It is render.yaml with these differences:
#   - plan: free. No charge, but Render puts the site to sleep after 15 minutes without visitors (waking it takes about
#     a minute) and may restart it at any time.
#   - No disk, because Render's free size cannot have one. Bookings and customer accounts are kept in a temporary folder
#     (DATA_DIR below) and are LOST whenever the site sleeps, restarts or is updated.
#   - So this size is for trying the site with Razorpay TEST keys (rzp_test_...) only. If live keys (rzp_live_...) are set
#     here, the site switches booking off by itself, so no customer ever pays real money for a booking that could be lost.
#     For a real business use render.yaml (about $7 a month, plus $0.25 for the disk).
#   - Nothing is pretended. Payment is always Razorpay's own window. Until RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET are added
#     (TEST keys, from the Razorpay dashboard in Test Mode) under Environment in the Render dashboard, booking is switched
#     off and the owner's pages say why. The webhook secret (RAZORPAY_WEBHOOK_SECRET) and the business details (SITE_NAME,
#     BUSINESS_NAME, SUPPORT_EMAIL, SUPPORT_PHONE, BUSINESS_ADDRESS) can be added there too.
#   - No boxes to fill in when it is created. Render makes up the admin password itself (OPERATOR_PASSWORD).
#
# To use it, choose New > Blueprint in Render and set "Blueprint Path" to render-free.yaml (the steps are in
# DEPLOY-RENDER.md, under "A free demo first").
#
# Nothing secret belongs in this file.
#
# TRUST_PROXY and PORT are left out on purpose, because on Render the site chooses them by itself. To change a price or
# another setting later, add it under Environment in the Render dashboard (every setting is listed in .env.example).

services:
  - type: web
    name: parking-site-demo
    runtime: node
    region: singapore            # the nearest to India. The others: oregon, ohio, virginia, frankfurt
    plan: free                   # no disk is possible on this size
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "commit"  # every push to this branch goes live by itself (this is a test site)
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: NODE_ENV
        value: production
      # There is no disk to save to, so bookings go in a temporary folder. The site shows a red "not on the Render disk"
      # message about it, which is expected here: the folder is emptied whenever the site sleeps, restarts or is updated.
      - key: DATA_DIR
        value: /tmp/bayfind-demo-data
      # The admin password for /login (the user name is "operator"). Render makes one up. To see it, or to put in one of
      # your own, open the service in Render and choose Environment.
      - key: OPERATOR_PASSWORD
        generateValue: true
