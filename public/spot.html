<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Parking details · {{SITE_NAME}}</title>
  <meta name="description" content="Where the booked bay is: level or zone and lot number.">
  <meta name="theme-color" content="#0b1530">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/gate.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header on-dark">
  <div class="bar">
    <a class="brand" href="/" aria-label="{{SITE_NAME}} home"><span class="brand-mark" aria-hidden="true">{{LOGO_LETTER}}</span>{{SITE_NAME}}</a>
    <nav class="nav" aria-label="Main">
      <a class="nav-cta" href="/book">Book a bay</a>
    </nav>
  </div>
</header>

<main id="main" class="wrap-narrow main-pad">
  <div class="stack g12 rise">
    <p class="eyebrow">Parking details</p>
    <h1 class="h1">Where to park</h1>
  </div>

  <div class="stack g16">
    {{SPOT_BODY}}
    {{SPOT_STAFF_LINK}}
  </div>
</main>

<footer class="site-footer on-dark">
  <div class="bar">
    <div class="stack g12">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">{{LOGO_LETTER}}</span>{{SITE_NAME}}</a>
      <div class="copy">
        <span>© {{YEAR}} {{SITE_NAME}}</span>
      </div>
    </div>
    {{FOOTER_NAV}}
  </div>
</footer>
</body>
</html>
