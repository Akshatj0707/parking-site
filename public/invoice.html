<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Invoice · {{SITE_NAME}}</title>
  <meta name="description" content="The invoice of a finished parking booking.">
  <meta name="theme-color" content="#0b1530">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/gate.css">
  <link rel="stylesheet" href="/css/invoice.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="mode-banner" class="mode-banner" role="status" hidden></div>

<header class="site-header on-dark">
  <div class="bar">
    <a class="brand" href="/" aria-label="{{SITE_NAME}} home"><span class="brand-mark" aria-hidden="true">{{LOGO_LETTER}}</span>{{SITE_NAME}}</a>
    <nav class="nav" aria-label="Main">
      <a class="opt" href="/lookup">Find my booking</a>
      <a class="nav-cta" href="/book">Book a bay</a>
    </nav>
  </div>
</header>

<main id="main" class="wrap-narrow main-pad">
  <div class="invoice-actions" id="invoice-actions" hidden>
    <button class="btn btn-navy" type="button" id="invoice-print">Print or save as PDF</button>
    <p class="fine">In the print window choose “Save as PDF” as the printer to keep a copy on your phone or computer.</p>
  </div>
  {{INVOICE_BODY}}
</main>

<footer class="site-footer on-dark">
  <div class="bar">
    <div class="stack g12">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">{{LOGO_LETTER}}</span>{{SITE_NAME}}</a>
      <div class="copy">
        <span>© {{YEAR}} {{SITE_NAME}}</span>
        <span>Payments are processed by Razorpay.</span>
      </div>
    </div>
    {{FOOTER_NAV}}
  </div>
</footer>

<script src="/js/shared.js"></script>
<script src="/js/common.js"></script>
<script src="/js/invoice.js"></script>
</body>
</html>
