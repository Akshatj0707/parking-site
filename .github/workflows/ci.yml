# Runs the automated checks (npm test) on GitHub every time code is pushed or a pull request is opened,
# so a change that breaks something shows a red cross instead of being found later.
name: Tests

on:
  push:
    branches: [free-demo, main]
  pull_request:
    branches: [free-demo, main]

permissions:
  contents: read

jobs:
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
