# Render Blueprint for this website. Render reads this file when you choose New > Blueprint (the steps are in
# DEPLOY-RENDER.md). It sets up one web service that runs the site, and a small disk where bookings are saved.
#
# Nothing secret belongs in this file. Every entry marked "sync: false" is a box that Render shows you when you create
# the site: you type the value there, and Render keeps it private.
#
# A few settings are left out on purpose, because on Render the site chooses them by itself:
#   TRUST_PROXY   1 (one proxy sits in front of the site). Check it on the dashboard, under "Setup check".
#   DATA_DIR      /var/data/test while Razorpay test keys are in use, /var/data/live once live keys are.
#                 That keeps test bookings apart from real ones, with nothing for you to do.
#   PORT          Render supplies it.
# To change a price or another setting later, add it under Environment in the Render dashboard
# (every setting is listed in .env.example).

services:
  - type: web
    name: parking-site
    runtime: node
    region: singapore            # the nearest to India. The others: oregon, ohio, virginia, frankfurt
    plan: 0.5c-512mb             # the $7 a month size. The free size cannot keep files, so it cannot hold bookings.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"     # an update goes live only when you press Deploy. "commit" would publish every upload at once.
    disk:
      name: parking-data
      mountPath: /var/data       # must stay /var/data: the site saves its bookings there (see src/config.js)
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: NODE_ENV
        value: production
      # Razorpay. Test keys start with rzp_test_ and live keys with rzp_live_. The webhook secret is a long text you make up.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # The password for /dashboard. The user name is "operator".
      - key: OPERATOR_PASSWORD
        sync: false
      # Your business, as shown on the website and on the Contact, Terms and Privacy pages.
      - key: SITE_NAME
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false
