# THIS FILE IS THE FREE DEMO, saved under the name that Render's deploy link looks for. This branch (free-demo) exists
# only so that ONE link can start the free demo, because the link can only read a file named render.yaml:
#   https://render.com/deploy?repo=https://github.com/YOUR-GITHUB-NAME/parking-site/tree/free-demo
# On the main branch render.yaml is the PAID blueprint and this same text is render-free.yaml. On this branch the paid
# blueprint is kept as render-paid.yaml. The services below must stay the same as in render-free.yaml (a test checks it).
# To bring this branch up to date: merge main into it, keep this file when render.yaml conflicts, and copy any change of
# main's render.yaml into render-paid.yaml.
#
# Render Blueprint for a FREE DEMO of this website. Use it to show the site on the internet at no cost, with nothing to type.
# It is render.yaml with these differences:
#   - plan: free. No charge, but Render puts the site to sleep after 15 minutes without visitors (waking it takes about
#     a minute) and may restart it at any time.
#   - No disk, because Render's free size cannot have one. Bookings are kept in a temporary folder (DATA_DIR below) and
#     are LOST whenever the site sleeps, restarts or is updated.
#   - So it is for demos only: never live Razorpay keys (rzp_live_...) and no real customers.
#     For a real site use render.yaml (about $7 a month, plus $0.25 for the disk).
#   - No boxes to fill in when it is created. Render makes up the dashboard password itself (OPERATOR_PASSWORD). With no
#     Razorpay keys the site simulates payment (DEMO_PAYMENTS), so everything can be tried at once. To get Razorpay's real
#     test window, add RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET (TEST keys, rzp_test_...) under Environment in the Render
#     dashboard. The webhook secret (RAZORPAY_WEBHOOK_SECRET) and the business details (SITE_NAME, BUSINESS_NAME,
#     SUPPORT_EMAIL, SUPPORT_PHONE, BUSINESS_ADDRESS) can be added there too.
#
# To use it, choose New > Blueprint in Render and set "Blueprint Path" to render-free.yaml (the steps are in
# DEPLOY-RENDER.md, under "A free demo first").
#
# Nothing secret belongs in this file.
#
# TRUST_PROXY and PORT are left out on purpose, because on Render the site chooses them by itself. To change a price or
# another setting later, add it under Environment in the Render dashboard (every setting is listed in .env.example).

services:
  - type: web
    name: parking-site-demo
    runtime: node
    region: singapore            # the nearest to India. The others: oregon, ohio, virginia, frankfurt
    plan: free                   # no disk is possible on this size
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "commit"  # every push to this branch goes live by itself (this is a test site)
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: NODE_ENV
        value: production
      # There is no disk to save to, so bookings go in a temporary folder. The site shows a red "not on the Render disk"
      # message about it, which is expected here: the folder is emptied whenever the site sleeps, restarts or is updated.
      - key: DATA_DIR
        value: /tmp/bayfind-demo-data
      # Without Razorpay keys a site in production switches booking off. For this demo the payment is simulated instead,
      # so the whole site works at once. When both Razorpay keys are added, the real Razorpay checkout takes over.
      - key: DEMO_PAYMENTS
        value: "on"
      # The password for /dashboard (the user name is "operator"). Render makes one up. To see it, or to put in one of
      # your own, open the service in Render and choose Environment.
      - key: OPERATOR_PASSWORD
        generateValue: true
